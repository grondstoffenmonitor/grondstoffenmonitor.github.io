name: Cijfers bijwerken

on:
  schedule:
    - cron: "17 5 * * *"   # elke dag rond 06:17 / 07:17 Nederlandse tijd
  workflow_dispatch: {}      # handmatig starten via het tabblad Actions

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cijfers ophalen
        run: python scripts/fetch.py
      - name: Wijzigingen opslaan
        run: |
          git config user.name "grondstoffenmonitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
          else
            git commit -m "Cijfers bijgewerkt $(date -u +%Y-%m-%d)"
            git push
          fi
